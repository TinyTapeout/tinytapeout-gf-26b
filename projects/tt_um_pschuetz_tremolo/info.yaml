# Tiny Tapeout project information
project:
  title:        "Tremolo guitar pedal ASIC"      # Project title
  author:       "Preston Schuetz"      # Your name
  discord:      "Presto"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "This is a PWM controller for a tremolo guitar pedal"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_pschuetz_tremolo"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Enable Tremolo"
  ui[1]: "Rate select bit 0"
  ui[2]: "Rate select bit 1"
  ui[3]: "Depth select bit 0"
  ui[4]: "Depth select bit 1"
  ui[5]: "Waveform select bit 0"
  ui[6]: "Waveform select bit 1"
  ui[7]: "Test speed select"

  # Outputs
  uo[0]: "PWM tremolo control output"
  uo[1]: "LFO debug output"
  uo[2]: "PWM carrier debug output"
  uo[3]: "Enable status"
  uo[4]: "Mod level debug bit"
  uo[5]: "Mod level debug bit"
  uo[6]: "Mod level debug bit"
  uo[7]: "Mod level debug bit"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
