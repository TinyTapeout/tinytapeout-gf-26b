# Tiny Tapeout project information
project:
  title:        "PWM-Analyser"    # Project title
  author:       "Pauline Kreis, Muhammad Saim Bilal"   # Your name
  discord:      ""                # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Analyses PWM signal and delivers duty Cycle and frequency measurements on a 7-segment display"
  language:     "Verilog"         # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     62_500_000    # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_PaulineKreis_PWM_Analyser"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_PaulineKreis_PWM_Analyser.v"
    - "PWM_Analyser.v"
    - "SevenSegmentDecoder.v"
    - "rising_edge_detect.v"
    - "freq_counter.v"
    - "falling_edge_detect.v"
    - "duty_cycle_counter.v"
    - "shift_subtract_divider.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "PWM_INPUT"        #Input for the PWM Signal to be analysed
  ui[1]: "MODE_SWITCH"      #Input to select which PWM property to view (1: Duty Cycle, 0: Frequency)
  ui[2]: "NC"
  ui[3]: "NC"
  ui[4]: "NC"
  ui[5]: "NC"
  ui[6]: "NC"
  ui[7]: "NC"

  # Outputs
  uo[0]: "G"                #Output to LED G of the 7-Segment Display
  uo[1]: "F"                #Output to LED F of the 7-Segment Display
  uo[2]: "E"                #Output to LED E of the 7-Segment Display
  uo[3]: "D"                #Output to LED D of the 7-Segment Display
  uo[4]: "C"                #Output to LED C of the 7-Segment Display
  uo[5]: "B"                #Output to LED B of the 7-Segment Display
  uo[6]: "A"                #Output to LED A of the 7-Segment Display
  uo[7]: "DP"               #Output to Decimal Point LED of the 7-Segment Display

  # Bidirectional pins
  uio[0]: "DIGIT_EN_3"      #Output Pin for selecting which 7-Segment Display to drive
  uio[1]: "DIGIT_EN_2"      #Output Pin for selecting which 7-Segment Display to drive
  uio[2]: "DIGIT_EN_1"      #Output Pin for selecting which 7-Segment Display to drive
  uio[3]: "DIGIT_EN_0"      #Output Pin for selecting which 7-Segment Display to drive
  uio[4]: "NC"
  uio[5]: "NC"
  uio[6]: "NC"
  uio[7]: "NC"

# Do not change!
yaml_version: 6
