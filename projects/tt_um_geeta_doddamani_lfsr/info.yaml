# Tiny Tapeout project information
project:
  title:        "4-bit Maximum-Length LFSR"
  author:       "Geeta Doddamani"
  discord:      ""
  description:  "A 4-bit maximum-length LFSR with seed 0x1 and feedback polynomial x4+x+1. Generates pseudo-random sequence of period 15."
  language:     "Verilog"
  clock_hz:     10_000_000

  # 1x1 tile as requested
  tiles: "1x1"

  # Must match the module name in project.v AND tb.v
  top_module:  "tt_um_geeta_doddamani_lfsr"

  source_files:
    - "project.v"

pinout:
  # Inputs (all unused)
  ui[0]: ""
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "LFSR bit 0 (LSB)"
  uo[1]: "LFSR bit 1"
  uo[2]: "LFSR bit 2"
  uo[3]: "LFSR bit 3 (MSB)"
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins (all unused)
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

