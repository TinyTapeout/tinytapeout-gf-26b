# Tiny Tapeout project information
project:
  title:        "BRISQ"      # Project title
  author:       "Poiku"      # Your name
  discord:      ".poiku"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "BRISQ: Binary Reduced Inverse SQrt"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_brisq"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "top.sv"
    - "fp32_mul.sv"
    - "fp32_sub.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "fp32_in_byte[0]"
  ui[1]: "fp32_in_byte[1]"
  ui[2]: "fp32_in_byte[2]"
  ui[3]: "fp32_in_byte[3]"
  ui[4]: "fp32_in_byte[4]"
  ui[5]: "fp32_in_byte[5]"
  ui[6]: "fp32_in_byte[6]"
  ui[7]: "fp32_in_byte[7]"

  # Outputs
  uo[0]: "fp32_out_byte[0]"
  uo[1]: "fp32_out_byte[1]"
  uo[2]: "fp32_out_byte[2]"
  uo[3]: "fp32_out_byte[3]"
  uo[4]: "fp32_out_byte[4]"
  uo[5]: "fp32_out_byte[5]"
  uo[6]: "fp32_out_byte[6]"
  uo[7]: "fp32_out_byte[7]"

  # Bidirectional pins
  uio[0]: "fp32_in_valid"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: "fp32_out_last"
  uio[7]: "fp32_out_valid"

# Do not change!
yaml_version: 6
