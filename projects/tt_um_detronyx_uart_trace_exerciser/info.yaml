# Tiny Tapeout project information
project:
  title:        "Detronyx UART Trace Exerciser"
  author:       "Detronyx contributors"
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "UART-controlled pattern generator and streaming trace/event analyzer"
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_detronyx_uart_trace_exerciser"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "trace_probe[0]"
  ui[1]: "trace_probe[1]"
  ui[2]: "trace_probe[2]"
  ui[3]: "trace_probe[3]"
  ui[4]: "trace_probe[4]"
  ui[5]: "trace_probe[5]"
  ui[6]: "trace_probe[6]"
  ui[7]: "trace_probe[7]"

  # Outputs
  uo[0]: "pattern[0]"
  uo[1]: "pattern[1]"
  uo[2]: "pattern[2]"
  uo[3]: "pattern[3]"
  uo[4]: "pattern[4]"
  uo[5]: "pattern[5]"
  uo[6]: "pattern[6]"
  uo[7]: "pattern[7]"

  # Bidirectional pins
  uio[0]: "uart_rx"
  uio[1]: "uart_tx"
  uio[2]: "trace_armed"
  uio[3]: "stream_enabled"
  uio[4]: "uart_busy"
  uio[5]: "trace_overflow"
  uio[6]: "uart_rx_error"
  uio[7]: "event_toggle"

# Do not change!
yaml_version: 6
