yaml_version: 6

project:
  title: "ECDSA Verification"
  author: "Lyra"
  discord: ""
  description: "Simplified ECDSA digital signature verification module using Verilog"
  language: "Verilog"
  clock_hz: 10000000
  tiles: "1x1"
  top_module: "tt_um_ecdsa_verify"

  source_files:
    - project.v

pinout:
